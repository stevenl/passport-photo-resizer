name: CI / Deploy

on:
  push:
    branches: [main]   # validate direct main pushes and deploy
  pull_request:        # validate PRs (including forks)

# Cancel in-progress runs on the same branch/PR when a new commit arrives,
# except on main where we want every deployment to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npm test

      # Cache Playwright browsers keyed on the Playwright version so the
      # ~120MB browser download only happens when the version changes.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # The browser binary is cached but OS-level dependencies (fonts,
        # shared libs) are not included in the cache. Install them separately.
        run: npx playwright install-deps chromium

      - name: Build
        # Single build used for both E2E and Pages upload.
        # On non-main branches, VITE_BASE_PATH is "/" (correct for preview).
        # On main we use the repo name so the Pages deployment works; the same
        # dist/ is reused for E2E (preview strips the sub-path internally).
        run: npm run build
        env:
          VITE_BASE_PATH: >-
            ${{ github.ref == 'refs/heads/main' && github.event_name == 'push'
              && format('/{0}/', github.event.repository.name)
              || '/' }}

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artefact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
